# Render config — https://render.com
services:
  - type: web
    name: food-tracker-connector
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      # NOTE: free tier has no persistent disk — the SQLite database is
      # ephemeral and resets on redeploy/restart. Fine for testing; use a
      # paid plan with a disk (or external DB) before public submission.
      # Set for real before public deploy:
      - key: PUBLIC_ORIGIN
        value: https://food-tracker-connector.onrender.com
      - key: SUPPORT_EMAIL
        value: Mendelsohnnewsletter@gmail.com
