# fly.io config — https://fly.io
app = "food-tracker-connector"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[mounts]]
  source = "food_tracker_data"
  destination = "/data"

[env]
  PORT = "8000"
  # Set for real before deploy:
  # PUBLIC_ORIGIN = "https://<your-domain>"
  # SUPPORT_EMAIL = "Mendelsohnnewsletter@gmail.com"
